# Publishes a release when a `v*` tag is pushed (`npm version <patch|minor|major>` then `git push --follow-tags`):
# checks the tag matches package.json, runs the checks, publishes to npmjs.com with provenance, and opens a GitHub
# release whose notes are that version's CHANGELOG section. Needs the NPM_TOKEN repository secret.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: node scripts/changelog.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
