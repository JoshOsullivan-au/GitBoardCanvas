<title>GitBoard Canvas</title>
<style>
:root {
  color-scheme: light;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.52 0 0);
  --accent: oklch(0.97 0 0);
  --destructive: oklch(0.505 0.213 27.518);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --sidebar: oklch(0.985 0 0);
  --sidebar-accent: oklch(0.97 0 0);
  --sidebar-border: oklch(0.922 0 0);
  --chart-1: oklch(0.87 0 0);
  --tick: oklch(0.6 0.13 150);
  --tone-good: oklch(0.5 0.12 150);
  --st-commit: oklch(0.52 0.15 255);
  --arrow: oklch(0.5 0.18 255);
  --arrow-soft: oklch(0.52 0.15 255);
  --st-pr: oklch(0.5 0.19 300);
  --tone-att: oklch(0.55 0.15 60);
  --hl: oklch(0.55 0.15 60);
  --link: oklch(0.78 0 0);
  --dot: oklch(0.82 0.01 255 / 0.55);
  --backdrop: radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0 / 8px 8px, radial-gradient(70% 60% at 12% 0%, oklch(0.93 0.03 255 / 0.9), transparent 70%), radial-gradient(60% 55% at 92% 100%, oklch(0.94 0.03 160 / 0.8), transparent 70%), oklch(0.965 0.004 255);
  --zsp: linear(0, 0.1157, 0.3366, 0.5536, 0.7259, 0.8465, 0.9234, 0.9681, 0.9916, 1.0023, 1.0059, 1.0061, 1.005, 1.0035, 1.0023, 1.0014, 1.0007, 1);
  --fg-a: oklch(0.145 0 0);
  --radius: 0.625rem;
  --radius-md: calc(var(--radius) * 0.8);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) * 1.4);
  --spring: linear(0, 0.0792, 0.2371, 0.4044, 0.5525, 0.6726, 0.7652, 0.8341, 0.8842, 0.9199, 0.9451, 0.9626, 0.9747, 0.9829, 0.9886, 0.9924, 0.9949, 0.9966, 0.9978, 0.9985, 0.999, 1);
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-heading: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.dark {
  color-scheme: dark;
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --popover: oklch(0.205 0 0);
  --primary: oklch(0.922 0 0);
  --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.269 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --border: oklch(1 0 0 / 10%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.556 0 0);
  --sidebar: oklch(0.205 0 0);
  --sidebar-accent: oklch(0.269 0 0);
  --sidebar-border: oklch(1 0 0 / 10%);
  --tick: oklch(0.72 0.14 150);
  --tone-good: oklch(0.75 0.13 150);
  --st-commit: oklch(0.74 0.12 255);
  --arrow: oklch(0.72 0.14 255);
  --arrow-soft: oklch(0.8 0.09 255);
  --st-pr: oklch(0.74 0.14 300);
  --tone-att: oklch(0.8 0.13 75);
  --hl: oklch(0.8 0.13 75);
  --link: oklch(1 0 0 / 26%);
  --dot: oklch(1 0 0 / 0.09);
  --backdrop: radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0 / 8px 8px, radial-gradient(70% 60% at 12% 0%, oklch(0.32 0.06 255 / 0.55), transparent 70%), radial-gradient(60% 55% at 92% 100%, oklch(0.3 0.05 160 / 0.45), transparent 70%), oklch(0.17 0.004 255);
  --fg-a: oklch(0.985 0 0);
}
* { box-sizing: border-box; }
:root { --gutter-x: clamp(20px, 2.2vw, 40px); }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.43;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Icons: light weight in light mode, regular in dark */
.ph { width: 1em; height: 1em; flex: none; fill: currentColor; }
.ph .w-regular { display: none; }
.dark .ph .w-light { display: none; }
.dark .ph .w-regular { display: inline; }

.icon-btn:focus-visible, .btn:focus-visible, .search input:focus-visible, .disc:focus-visible, .x:focus-visible { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); outline-offset: 1px; }

.page { height: 100vh; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ph-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 28px var(--gutter-x) 16px; }
.ph-head h1 { margin: 0; flex: none; white-space: nowrap; font: 600 30px/1.2 var(--font-heading); letter-spacing: -0.025em; }
.tools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
.tools > * { flex: none; }
.tools > .search { flex: 0 1 auto; min-width: 0; }
.search { position: relative; display: flex; align-items: center; min-width: 0; }
.search .ph { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--muted-foreground); pointer-events: none; }
.search input {
  height: 32px; width: clamp(160px, 18vw, 280px); max-width: 100%; padding: 0 10px 0 32px; border: 1px solid var(--input); border-radius: var(--radius-lg);
  background: transparent; color: var(--foreground); font: inherit;
}
.search input::placeholder { color: var(--muted-foreground); }
.btn {
  height: 32px; padding: 0 12px; border-radius: var(--radius-lg); border: 1px solid var(--border);
  background: var(--background); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none;
  transition: background-color 120ms var(--ease-out), transform 60ms var(--ease-out);
}
.btn:hover { background: var(--muted); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.primary:hover { background: color-mix(in oklch, var(--primary) 80%, transparent); }

/* The dotted canvas fills the whole board area edge to edge and scrolls with the cards; no scroll bars (trackpad, wheel and keys still scroll). */
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 16px var(--gutter-x) 32px; background: var(--backdrop); background-attachment: local; scrollbar-width: none; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
html, body { scrollbar-width: none; overflow: hidden; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
/* Liquid glass material (the .lg layer, regular and clear only).
   Liquid glass material adapted from Glass UI (MIT, Crenspire Technologies). See THIRD_PARTY_NOTICES.md. */
:root { --lg-rim-hi: rgba(255, 255, 255, 0.8); --lg-rim-lo: rgba(255, 255, 255, 0.18); --lg-highlight: rgba(255, 255, 255, 0.6); --lg-drop: rgba(15, 23, 42, 0.14); }
.dark { --lg-rim-hi: rgba(255, 255, 255, 0.34); --lg-rim-lo: rgba(255, 255, 255, 0.06); --lg-highlight: rgba(255, 255, 255, 0.16); --lg-drop: rgba(0, 0, 0, 0.45); }
.lg {
  --lg-tint: transparent;
  --lg-tint-amt: 0%;
  --lg-wash: color-mix(in oklab, var(--lg-tint) var(--lg-tint-amt), var(--lg-base));
  color: var(--foreground);
  border: 1px solid transparent;
  background: linear-gradient(var(--lg-wash), var(--lg-wash)) padding-box, linear-gradient(135deg, var(--lg-rim-hi), var(--lg-rim-lo) 35%, var(--lg-rim-lo) 65%, var(--lg-rim-hi)) border-box;
  backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-sat));
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-sat));
  box-shadow: inset 0 1px 0 var(--lg-highlight), 0 1px 2px var(--lg-drop), 0 12px 32px -14px var(--lg-drop);
}
.lg-regular { --lg-base: rgba(255, 255, 255, 0.42); --lg-blur: 16px; --lg-sat: 180%; }
.dark .lg-regular { --lg-base: rgba(255, 255, 255, 0.07); }
.lg-clear { --lg-base: rgba(255, 255, 255, 0.1); --lg-blur: 2px; --lg-sat: 150%; }
.dark .lg-clear { --lg-base: rgba(255, 255, 255, 0.04); }
/* The board's dark backdrop is near-black, where glass-ui's dark regular (white at 7%) reads as pale slabs: smoke it instead. */
.dark .lg-regular { --lg-base: rgba(22, 24, 31, 0.62); }
.dark .lg-clear { --lg-base: rgba(255, 255, 255, 0.025); }
/* The rim gradient sits on border-box under a translucent wash, so in dark it fills the whole panel with white and washes out the text: draw the rim as a plain border instead. */
.dark .lg { background: linear-gradient(var(--lg-wash), var(--lg-wash)) padding-box; border-color: var(--lg-rim-lo); }
.dark { --lg-rim-lo: rgba(255, 255, 255, 0.12); }
/* A column is a resting panel, so it keeps only the highlight; cards and headers keep the drop shadow. */
.fwcol.lg { box-shadow: inset 0 1px 0 var(--lg-highlight); }
@media (prefers-reduced-transparency: reduce) {
  .lg.lg { --lg-base: color-mix(in oklab, var(--background) 94%, transparent); backdrop-filter: none; -webkit-backdrop-filter: none; }
}

/* Board: stage columns on a dotted surface, a group of cards per column, glass cards, links traced on hover */
.fwcols { position: relative; display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(228px, 1fr)); gap: 12px; min-width: calc(var(--cols, 5) * 240px - 12px); overflow: clip; }
.fwcol { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 8px 8px 20px; min-width: 0; border-radius: 18px; }
/* the column is glass-ui clear glass: the backdrop shows through, nothing else is drawn */
.fwcol.now { --lg-tint: var(--arrow); --lg-tint-amt: 7%; }
.fwsh { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; }
.fwsh .t { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; font: 600 18px/1.2 var(--font-heading); }
.fwsh .sn { font: 500 12px/1 var(--font-sans); color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.fwsh .cnt { font-size: 12.5px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.pill { font-size: 11.5px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; background: var(--card); }
.grp { display: flex; flex-direction: column; }
.gh { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; background: none; cursor: pointer; text-align: left; font-weight: 500; font-size: 13px; color: var(--muted-foreground); border-radius: 8px; }
.gh .gn { color: var(--foreground); }
.gh:hover { background: color-mix(in oklch, var(--fg-a) 4%, transparent); }
.gh:focus-visible { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); }
.gh .car { font-size: 12px; color: var(--muted-foreground); transition: transform 200ms var(--ease-out); }
.gh[aria-expanded="true"] .car { transform: rotate(90deg); }
.gh .gi { font-size: 15px; color: var(--muted-foreground); }
.gh .gn { flex: 1; min-width: 0; }
.gh .gm { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 450; color: var(--muted-foreground); }
.gh .gm .ph { font-size: 12px; }
.gh .gm.blk { color: var(--arrow-soft); }
.gb { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 350ms var(--spring); }
.gb > .inner { overflow: hidden; min-height: 0; }
.grp[data-collapsed] .gb { grid-template-rows: 0fr; }
.cell { display: flex; flex-direction: column; gap: 16px; padding: 10px 6px 12px; min-height: 8px; } /* room for the hover zoom and the 3px ring */
.grp.empty .cell { min-height: 52px; }
.cell[data-over] { background: color-mix(in oklch, var(--arrow) 8%, transparent); border-radius: 12px; }
.card { position: relative; z-index: 3; display: flex; align-items: center; gap: 9px; height: 52px; padding: 8px 9px; border-radius: 12px; cursor: grab; user-select: none; touch-action: none; transition: opacity 200ms ease-out, transform 550ms var(--zsp); }
.card::before { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: 0 16px 32px -12px var(--lg-drop); opacity: 0; pointer-events: none; transition: opacity 200ms ease-out; }
.card::after { content: ""; position: absolute; inset: -3px; border-radius: 14px; border: 1.5px solid var(--arrow); opacity: 0; pointer-events: none; transition: opacity 200ms ease-out; }
.card:hover { transform: scale(1.015); }
.card:hover::before { opacity: 1; }
.card:focus-visible { outline: 2px solid var(--foreground); outline-offset: 3px; }
.card .tile { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--border); background: color-mix(in oklch, var(--background) 55%, transparent); font-size: 16px; color: var(--muted-foreground); }
.card .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.card .tx b { font-weight: 500; font-size: 13px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .tx span { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .st { flex: none; width: 18px; height: 18px; display: grid; place-items: center; font-size: 12px; }
.card.done { --lg-rim-hi: color-mix(in oklch, var(--tone-good) 70%, transparent); --lg-rim-lo: color-mix(in oklch, var(--tone-good) 25%, transparent); }
.card.done .st { color: oklch(0.99 0 0); background: var(--tone-good); border-radius: 999px; }
.card.lock .tile { opacity: 0.55; }
.card.lock .tx b { color: var(--muted-foreground); }
.card.lock .st { color: var(--muted-foreground); }
.card.lock .tx span { color: var(--arrow-soft); }
.card.wait .st::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--arrow-soft); border-right-color: transparent; border-radius: 999px; }
.card .chips { position: absolute; right: 10px; top: -9px; z-index: 2; display: flex; gap: 4px; pointer-events: none; }
.card .av-b { display: inline-flex; white-space: nowrap; align-items: center; gap: 2px; font-size: 10px; line-height: 12px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); }
.card .av-b .ph { font-size: 10px; }
.card .av-b.dt { color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.gs-wip { --gs: var(--muted-foreground); }
.gs-staged { --gs: var(--tone-att); }
.gs-committed { --gs: var(--st-commit); }
.gs-pr { --gs: var(--st-pr); }
.card .av-b[class*="gs-"] { color: var(--gs); border-color: color-mix(in oklch, var(--gs) 35%, var(--border)); font-weight: 500; }
.pop-wrap { position: relative; }
.fcount { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); font-size: 11px; display: inline-grid; place-items: center; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 420px; max-height: min(70vh, 640px); overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; border-radius: var(--radius-xl); background: var(--popover); border: 1px solid var(--border); box-shadow: 0 10px 30px -10px oklch(0 0 0 / 25%); animation: popin 180ms var(--ease-out); }
@keyframes popin { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
.fg { display: flex; flex-direction: column; gap: 6px; }
.fgh { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-foreground); }
.fgh .miss { letter-spacing: 0; text-transform: none; font-weight: 450; color: var(--tone-att); }
.fopts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--background); cursor: pointer; font-size: 13px; transition: background-color 120ms var(--ease-out), border-color 120ms var(--ease-out); }
.opt .ph { font-size: 14px; color: var(--muted-foreground); }
.opt b { font-weight: 450; color: var(--muted-foreground); font-size: 12px; }
.opt:hover { background: var(--muted); }
.opt[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.opt[aria-pressed="true"] .ph, .opt[aria-pressed="true"] b { color: inherit; opacity: 0.8; }
.opt:focus-visible { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); }
.pop .pf { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 10px; color: var(--muted-foreground); font-size: 13px; }
.order { position: relative; display: inline-flex; white-space: nowrap; align-items: center; height: 32px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); padding: 0 8px; gap: 6px; }
.order .ph { font-size: 15px; color: var(--muted-foreground); }
.order select { appearance: none; border: 0; background: none; font: inherit; font-weight: 500; color: var(--foreground); padding-right: 16px; cursor: pointer; }
.order select:focus-visible { outline: none; }
.order:focus-within { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); }
.order .caret { position: absolute; right: 8px; pointer-events: none; }
.order .caret .ph { font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
.card[data-grabbed]::after, .card.on::after { opacity: 1; }
.card[data-dragging] { box-shadow: none; background: color-mix(in oklch, var(--fg-a) 6%, transparent); border-style: dashed; }
.card[data-dragging] > * { visibility: hidden; }
.fwcols.tracing .card.off, .fwcols.tracing .grp.off { opacity: 0.3; }
.fwlinks { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; overflow: visible; }
.fwlinks path { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.fwlinks .lnk path { stroke: var(--link); stroke-dasharray: 0 4; }
.fwlinks .dep path { stroke: color-mix(in oklch, var(--arrow) 55%, transparent); }
.fwlinks .blk path { stroke: var(--arrow); stroke-width: 2; }
.fwlinks .a { stroke-width: 1.5; }
.meter { flex: none; width: 56px; height: 4px; border-radius: 999px; background: color-mix(in oklch, var(--fg-a) 10%, transparent); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--foreground); border-radius: inherit; }
@media (prefers-reduced-motion: reduce) { .card, .card::before, .card::after, .gb, .gh .car { transition: none; } .card:hover { transform: none; } }

.ghost {
  position: fixed; z-index: 50; pointer-events: none; padding: 9px 12px; border-radius: var(--radius-lg);
  background: var(--popover); border: 1px solid color-mix(in oklch, var(--fg-a) 10%, transparent);
  box-shadow: 0 12px 24px -12px rgb(0 0 0 / 0.25); display: flex; flex-direction: column; gap: 4px;
  rotate: -1.5deg; scale: 1.02; transition: rotate 160ms var(--ease-out), scale 160ms var(--ease-out);
}
.ghost.enter { rotate: 0deg; scale: 1; }
.ghost .title { margin: 0; font-weight: 450; line-height: 18px; }
.ghost .ref { font-size: 12px; color: var(--muted-foreground); }

/* Loading skeleton */
.sk { border-radius: var(--radius-md); background: color-mix(in oklch, var(--fg-a) 8%, transparent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }

/* Dialogs */
dialog {
  border: 0; padding: 0; border-radius: var(--radius-xl); background: var(--popover); color: var(--foreground);
  box-shadow: 0 0 0 1px color-mix(in oklch, var(--fg-a) 10%, transparent), 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  width: min(28rem, calc(100vw - 32px));
  opacity: 0; scale: 0.96; transition: opacity 150ms var(--ease-out), scale 150ms var(--ease-out), overlay 150ms allow-discrete, display 150ms allow-discrete;
}
dialog[open] { opacity: 1; scale: 1; }
@starting-style { dialog[open] { opacity: 0; scale: 0.96; } }
dialog::backdrop { background: rgb(0 0 0 / 0.1); backdrop-filter: blur(4px); }
dialog.wide { width: min(34rem, calc(100vw - 32px)); }
.dlg { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
.dlg h2 { margin: 0; font: 600 20px/1.375 var(--font-heading); padding-right: 32px; }
.dlg .sub { color: var(--muted-foreground); margin-top: -10px; }
.dlg ul.lines { margin: 0; padding-left: 18px; color: var(--muted-foreground); display: flex; flex-direction: column; gap: 4px; }
.dlg ul.lines li.warn { color: var(--foreground); }
.branches { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.branches li { display: flex; align-items: center; gap: 8px; }
.branches .ph { font-size: 16px; color: var(--muted-foreground); }
.branches .state { margin-left: auto; color: var(--muted-foreground); }

.md h1 { font-size: 26px; } .md h2 { font-size: 20px; } .md h3 { font-size: 17px; } .md h4 { font-size: 15px; }
.md p, .md ul, .md ol, .md table, .md pre, .md blockquote { margin: 0 0 0.8em; }

/* Toast */

  display: flex; align-items: center; gap: 12px; min-width: 320px; padding: 12px 14px; border-radius: var(--radius-lg);
  background: var(--popover); border: 1px solid var(--border); box-shadow: 0 4px 12px rgb(0 0 0 / 0.08);

@media (prefers-reduced-motion: reduce) {

  .ghost { rotate: 0deg; scale: 1; }
}

.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--background); color: var(--foreground); cursor: pointer; font-size: 16px; transition: background-color 120ms var(--ease-out); }

.btn[aria-busy="true"] { pointer-events: none; }

@keyframes spin { to { rotate: 360deg; } }

<body>
<main class="page">
  <header class="ph-head">
    <h1>GitBoard Canvas</h1>
    <div class="tools">
      <div class="pop-wrap">
        <button type="button" class="btn" id="filterBtn" aria-expanded="false" aria-controls="filterPanel"><span data-icon="Funnel"></span>Filter<span class="fcount" id="fcount" hidden></span></button>
        <div class="pop" id="filterPanel" role="dialog" aria-label="Filter" hidden></div>
      </div>
      <label class="order"><span data-icon="ArrowsDownUp"></span><span class="sr-only">Order</span>
        <select id="order" aria-label="Order cards">
          <option value="touched">Last change</option>
          <option value="git">Furthest in git</option>
          <option value="flight">Most files in flight</option>
          <option value="blocked">Blocked first</option>
          <option value="gated">Most waiting on you</option>
          <option value="done">Most complete</option>
          <option value="todo">Least complete</option>
          <option value="linked">Most linked</option>
          <option value="landed">Last landed</option>
          <option value="created">Newest created</option>
          <option value="stage">Roadmap order</option>
          <option value="title">Title A to Z</option>
        </select>
        <span class="caret" data-icon="CaretDown"></span>
      </label>
      <label class="search"><span data-icon="MagnifyingGlass"></span><input id="q" type="search" placeholder="Search" aria-label="Search features" autocomplete="off"></label>
      <button type="button" class="btn" id="collapse">Collapse all</button>
      <button type="button" class="icon-btn" id="theme" aria-label="Switch theme"></button>
    </div>
  </header>
  <div class="scroll" id="scroll">
    <div class="board" id="board"></div>
  </div>
</main>

<dialog id="details" class="wide" aria-labelledby="d-title"></dialog>
<dialog id="confirm" aria-labelledby="c-title"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<p class="sr-only" id="announce" aria-live="assertive"></p>

<script>
const ICONS = __ICONS__;

/* Filled from /api/board: stages, groups, the roadmap folder and the main branch. */
let STAGES = [];
let GROUPS = [];
let ROADMAP_DIR = "";
let MAIN_BRANCH = "main";
const GROUP_ICON = "Stack";
let GROUP_ICONS = {};
const groupIcon = (g) => (ICONS[GROUP_ICONS[g]] ? GROUP_ICONS[g] : GROUP_ICON);
const lastStage = () => STAGES[STAGES.length - 1]?.id;
const isDone = (c) => c.stage === lastStage();
const POLL_MS = 3000;
const SPRING_MS = 650;
const SPRING = getComputedStyle(document.documentElement).getPropertyValue("--spring").trim();
const reduce = matchMedia("(prefers-reduced-motion: reduce)");

const icon = (name) => {
  const p = ICONS[name];
  return `<svg class="ph" viewBox="0 0 256 256" aria-hidden="true"><path class="w-light" d="${p.light[0]}"/><path class="w-regular" d="${p.regular[0]}"/></svg>`;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const stageName = (id) => STAGES.find((s) => s.id === id)?.name ?? String(id);
const ddmmyyyy = (ms) => {
  const d = new Date(ms);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
};
const ddmm = (ms) => {
  if (!ms) return "";
  const d = new Date(ms);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
};

let cards = [];
let byId = new Map();
let version = null;
const FILTER_GROUPS = ["git", "state", "group", "stage", "progress"];
const emptyFilters = () => Object.fromEntries(FILTER_GROUPS.map((g) => [g, new Set()]));
const state = { q: "", collapsed: new Set(), filters: emptyFilters(), order: "touched", github: null, trace: null, loading: true, focusId: null, grab: null, drag: null, busy: false };
try {
  const saved = JSON.parse(localStorage.getItem("gitboard-view") || "{}");
  state.collapsed = new Set(saved.collapsed || []);
  for (const g of FILTER_GROUPS) state.filters[g] = new Set(saved.filters?.[g] || []);
  if (saved.order) state.order = saved.order;
} catch {}
const saveView = () => {
  try {
    localStorage.setItem("gitboard-view", JSON.stringify({
      collapsed: [...state.collapsed],
      filters: Object.fromEntries(FILTER_GROUPS.map((g) => [g, [...state.filters[g]]])),
      order: state.order,
    }));
  } catch {}
};

document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = icon(el.dataset.icon)));
const board = document.getElementById("board");
const collapseBtn = document.getElementById("collapse");
const announceEl = document.getElementById("announce");
const say = (t) => { announceEl.textContent = ""; requestAnimationFrame(() => (announceEl.textContent = t)); };

/* ---- server ---- */
async function api(pathname, body) {
  const res = await fetch(pathname, body
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }
    : { cache: "no-store" });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || "The board server did not answer.");
  return json;
}
async function refresh() {
  const data = await api("/api/board");
  cards = data.cards;
  STAGES = data.stages;
  ROADMAP_DIR = data.roadmapDir;
  MAIN_BRANCH = data.mainBranch;
  GROUPS = [...new Set([...data.groups, ...cards.map((c) => c.group)])];
  GROUP_ICONS = data.groupIcons || {};
  cards.forEach((c, i) => { c.idx = i; });
  byId = new Map(cards.map((c) => [c.id, c]));
  buildFilterOptions();
  derive();
  version = data.version;
  state.github = data.github;
  state.loading = false;
  render();
}
const quiet = () => !state.drag && !state.grab && !state.busy && !document.querySelector("dialog[open]");
async function poll() {
  try {
    const { version: v } = await api("/api/version");
    if (v !== version && quiet()) await refresh();
  } catch {
    /* the next tick tries again */
  }
  setTimeout(poll, POLL_MS);
}

/* ---- relations: blocked waits on a feature that is not in the last stage; gated waits on a person; linked is any other mention ---- */
function derive() {
  for (const c of cards) { c.dependents = []; c.backlinks = []; }
  for (const c of cards) {
    c.deps = c.deps.filter((id) => byId.has(id));
    c.links = c.links.filter((id) => byId.has(id));
    for (const d of c.deps) byId.get(d).dependents.push(c.id);
    for (const l of c.links) byId.get(l).backlinks.push(c.id);
  }
  for (const c of cards) {
    const open = !isDone(c);
    c.blockedBy = open ? c.deps.filter((id) => !isDone(byId.get(id))) : [];
    c.gated = open && (c.decisions.length > 0 || c.ops.length > 0);
    c.linkIds = [...new Set([...c.links, ...c.backlinks, ...c.deps, ...c.dependents])];
    c.chained = c.deps.length > 0 || c.dependents.length > 0;
  }
}
const isBlocked = (c) => c.blockedBy.length > 0;
/* ---- git pipeline: per feature, the furthest state its branches reach ---- */
const GIT_STEPS = [
  { k: "wip", name: "WIP", icon: "PencilSimpleLine" },
  { k: "staged", name: "Staged", icon: "Tray" },
  { k: "committed", name: "Committed", icon: "GitCommit" },
  { k: "pr", name: "PR", icon: "GitPullRequest" },
];
const GIT_RANK = { landed: 0, wip: 1, staged: 2, committed: 3, pr: 4 };
function gitSummary(c) {
  const t = { wip: 0, staged: 0, committed: 0, pr: 0, prs: [] };
  for (const g of c.git) {
    t.wip += g.wip; t.staged += g.staged; t.committed += g.committed;
    if (g.pr) { t.pr += 1; t.prs.push(g.pr); }
  }
  t.flight = t.wip + t.staged + t.committed;
  t.top = t.pr ? "pr" : t.committed ? "committed" : t.staged ? "staged" : t.wip ? "wip" : c.landed ? "landed" : null;
  t.rank = t.top ? GIT_RANK[t.top] : -1;
  return t;
}
function gitBadge(c) {
  const t = gitSummary(c);
  if (!t.top || t.top === "landed") return "";
  const step = GIT_STEPS.find((x) => x.k === t.top);
  const text = t.top === "pr" ? (t.prs.length === 1 ? `PR #${t.prs[0].number}` : `${t.prs.length} PRs`) : `${t[t.top]} ${step.name === "WIP" ? "WIP" : step.name.toLowerCase()}`;
  return `<span class="av-b gs-${t.top}" title="${esc(c.git.map((g) => g.branch).join(", "))}">${icon(step.icon)}${esc(text)}</span>`;
}

/* ---- filters: options in one group widen (or), groups narrow (and); filtered cards are hidden ---- */
const progressOf = (c) => (!c.total ? "none" : c.done === 0 ? "not" : c.done === c.total ? "all" : "under");
const FILTER_OPTIONS = {
  git: [
    ["wip", "WIP", "PencilSimpleLine", (c) => gitSummary(c).wip > 0],
    ["staged", "Staged", "Tray", (c) => gitSummary(c).staged > 0],
    ["committed", "Committed", "GitCommit", (c) => gitSummary(c).committed > 0],

    <div class="route"><span class="pill">${p.from.id} ${esc(p.from.name)}</span>${icon("ArrowRight")}<span class="pill to">${p.to.id} ${esc(p.to.name)}</span></div>
    ${plan.warnings.length ? `<ul class="warns">${plan.warnings.map((w) => `<li>${icon("Warning")}<span>${esc(w)}</span></li>`).join("")}</ul>` : ""}
    <ol class="steps">${p.steps.map((st) => `<li><span class="si">${icon(st.icon)}</span><div class="sx"><b>${esc(st.title)}</b><span>${st.detail}</span>${st.list ? `<details><summary>${icon("CaretRight")}Show files</summary><ul>${st.list.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}</div></li>`).join("")}</ol>
    <p class="err" role="alert" hidden></p>
    <div class="foot"><span class="note">Nothing is pushed</span><button type="button" class="btn" data-act="cancel">Cancel</button><button type="button" class="btn primary" data-act="move" autofocus>Move and merge</button></div>
  </div>`;
  let moved = false;
  dlg.querySelector('[data-act="cancel"]').onclick = () => dlg.close();
  dlg.querySelector('[data-act="move"]').onclick = async (e) => {
    const btn = e.currentTarget;
    btn.setAttribute("aria-busy", "true");
    dlg.querySelector('[data-act="cancel"]').disabled = true;
    state.busy = true;
    dlg.querySelector(".steps").classList.add("running");
    try {
      const { commit } = await api("/api/move", { slug: c.slug, from, to });
      moved = true;
      dlg.close();
      say(`${c.title} moved to ${stageName(to)}.`);
      toast(`${c.title} moved to ${stageName(to)} · ${commit.slice(0, 8)}`, { undo: () => undoMove(c.slug, to, from, c.title), commit });
    } catch (error) {
      // Keep the plan on screen with what went wrong; closing puts the card back.
      dlg.querySelector(".steps").classList.remove("running");
      const err = dlg.querySelector(".err");
      err.textContent = `Could not move ${c.title}. ${error.message}`;
      err.hidden = false;
      btn.remove();
      const cancel = dlg.querySelector('[data-act="cancel"]');
      cancel.disabled = false;
      cancel.textContent = "Close";
      cancel.focus();
      say(`Could not move ${c.title}.`);
    } finally {
      state.busy = false;
      await refresh().catch(() => {});
    }
  };
  dlg.oncancel = (e) => { if (state.busy) e.preventDefault(); };
  dlg.onclose = () => {
    if (!moved && !state.busy) { revert(c, from); say("Move cancelled."); }
    state.focusId = `${moved ? to : from}:${c.slug}`;
  };
  dlg.showModal();
}
async function undoMove(slug, from, to, title) {
  state.busy = true;
  try {
    const plan = await api("/api/plan", { slug, from, to });
    if (plan.blocked) throw new Error(plan.blocked);
    await api("/api/move", { slug, from, to });
    say(`${title} moved back to ${stageName(to)}.`);
  } catch (error) {
    toast(`Could not move ${title} back. ${firstLine(error.message)}`, { err: true });
  } finally {
    state.busy = false;
    await refresh().catch(() => {});
  }
}
const firstLine = (m) => String(m).split("\n")[0];
function toast(text, { err = false, undo } = {}) {
  const host = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = `toast${err ? " err" : ""}`;
  el.setAttribute("role", err ? "alert" : "status");
  el.innerHTML = `<span>${esc(text)}</span>${undo ? `<button type="button" class="btn">${icon("ArrowCounterClockwise")}Undo</button>` : ""}`;
  if (undo) el.querySelector("button").onclick = () => { el.remove(); undo(); };
  host.append(el);
  setTimeout(() => el.remove(), err ? 10000 : 8000);
}

/* ---- pointer drag: a card stays in its group group; only the stage changes ---- */
let ghost = null;
board.addEventListener("pointerdown", (e) => {
  const el = e.target.closest("[data-card]");
  if (!el || e.button !== 0 || state.busy) return;
  const r = el.getBoundingClientRect();
  const c = byId.get(el.dataset.card);
  state.drag = { id: c.id, from: c.stage, group: c.group, sx: e.clientX, sy: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, active: false, over: null };
  board.setPointerCapture(e.pointerId);
});
board.addEventListener("pointermove", (e) => {
  const d = state.drag;
  if (!d) return;
  if (!d.active) {
    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 4) return;
    d.active = true;
    setTrace(null);
    const c = byId.get(d.id);
    ghost = document.createElement("div");
    ghost.className = "ghost enter";
    ghost.style.width = `${d.w}px`;
    ghost.innerHTML = `<span class="ref">${ddmm(c.touchedAt)}</span><p class="title">${esc(c.title)}</p>`;
    document.body.append(ghost);
    requestAnimationFrame(() => ghost?.classList.remove("enter"));
    document.body.style.cursor = "grabbing";
    render({ flip: false });
  }
  ghost.style.left = `${e.clientX - d.dx}px`;
  ghost.style.top = `${e.clientY - d.dy}px`;
  const hit = [...board.querySelectorAll(`.cell[data-cellgroup="${CSS.escape(d.group)}"]`)].find((cell) => {
    const r = cell.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right;
  });
  if (!hit) return;
  const stage = Number(hit.dataset.stage);
  const over = `${d.group}|${stage}`;
  state.collapsed.delete(`${stage}|${d.group}`);
  const moved = placeTemp(byId.get(d.id), stage);
  if (moved || d.over !== over) { d.over = over; render(); }
});
function clearDrag() {
  state.drag = null;
  ghost?.remove();
  ghost = null;
  document.body.style.cursor = "";
}
board.addEventListener("pointerup", () => {
  const d = state.drag;
  if (!d) return;
  clearDrag();
  const c = byId.get(d.id);
  if (!d.active) { openDetails(c); return; }
  render({ flip: false });
  askMove(c, d.from);
});
board.addEventListener("pointercancel", () => {
  const d = state.drag;
  clearDrag();
  if (d?.active) revert(byId.get(d.id), d.from);
});

/* ---- keyboard: Space grabs and drops, arrows change stage, Escape cancels, Enter opens ---- */
board.addEventListener("keydown", (e) => {
  const el = e.target.closest("[data-card]");
  if (!el || state.busy) return;
  const c = byId.get(el.dataset.card);
  const g = state.grab;
  state.focusId = c.id;
  if (e.key === " ") {
    e.preventDefault();
    if (g?.id === c.id) { state.grab = null; render(); askMove(c, g.from); }
    else { state.grab = { id: c.id, from: c.stage }; render(); say(`${c.title} grabbed. Left and right arrows change the stage.`); }
  } else if (e.key === "Escape" && g?.id === c.id) {
    e.preventDefault();
    state.grab = null;
    revert(c, g.from);
    say("Move cancelled.");
  } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && g?.id === c.id) {
    e.preventDefault();
    const next = c.stage + (e.key === "ArrowLeft" ? -1 : 1);
    if (!STAGES.some((s) => s.id === next)) return;
    placeTemp(c, next);
    render();
    say(stageName(next));
  } else if (e.key === "Enter" && !g) {
    e.preventDefault();
    openDetails(c);
  }
});

/* ---- details ---- */
function featureRows(ids) {
  return `<ul class="rel">${ids.map((id) => byId.get(id)).filter(Boolean).sort((a, b) => a.stage - b.stage || a.title.localeCompare(b.title)).map((n) => {
    const st = cardState(n);
    return `<li><button type="button" class="relr ${st.cls}" data-goto="${esc(n.id)}"><span class="tile">${icon(groupIcon(n.group))}</span><span class="tx"><b>${esc(n.title)}</b><span>${n.stage} ${esc(stageName(n.stage))} · ${esc(st.word)}</span></span></button></li>`;
  }).join("")}</ul>`;
}
const VIA = { roadmap: "roadmap files", branch: "branch name", code: "code it names" };
function gitHtml(c) {
  const rows = c.git.map((g) => {
    const counts = { wip: g.wip, staged: g.staged, committed: g.committed, pr: g.pr ? 1 : 0 };
    const files = [["WIP", g.files.wip, g.wip], ["Staged", g.files.staged, g.staged], ["Committed", g.files.committed, g.committed]].filter(([, , n]) => n);
    return `<li class="gitb">
      <div class="gbh">${icon("GitBranch")}<b>${esc(g.branch)}</b><span class="via">via ${VIA[g.via]}</span>${g.pr ? `<a href="${esc(g.pr.url)}" target="_blank" rel="noopener noreferrer">PR #${g.pr.number}${g.pr.draft ? " (draft)" : ""}</a>` : ""}</div>
      <ol class="track">${GIT_STEPS.map((x) => `<li class="${counts[x.k] ? `on gs-${x.k}` : ""}"><span class="dot">${icon(x.icon)}</span><span class="tn">${x.name}</span><b>${x.k === "pr" ? (g.pr ? `#${g.pr.number}` : "") : counts[x.k] || ""}</b></li>`).join("")}<li class="${""}"><span class="dot">${icon("GitMerge")}</span><span class="tn">Landed</span><b></b></li></ol>
      ${g.commits ? `<div class="gnote">${plural(g.commits, "commit")} not on main</div>` : ""}
      ${files.length ? `<details class="gfiles"><summary>${icon("CaretRight")}Files</summary>${files.map(([k, list, n]) => `<div class="gfk">${k}</div><ul>${list.map((f) => `<li>${esc(f)}</li>`).join("")}${n > list.length ? `<li class="more">${n - list.length} more</li>` : ""}</ul>`).join("")}</details>` : ""}
    </li>`;
  });
  const landed = c.landed ? `<div class="landed">${icon("GitMerge")}<span>Landed on main ${ddmm(c.landed.at)} · ${esc(c.landed.sha)}</span></div>` : "";
  const gh = state.github === false ? `<div class="gnote">Pull requests: Missing GitHub</div>` : "";
  if (!rows.length && !landed && !gh) return "";
  return `<section class="ps"><h5>${icon("GitBranch")}Git</h5>${rows.length ? `<ul class="gitl">${rows.join("")}</ul>` : ""}${landed}${gh}</section>`;
}
function relationsHtml(c) {
  const parts = [];
  if (c.blockedBy.length) parts.push(`<section class="ps"><h5>${icon("Lock")}Blocked by</h5>${featureRows(c.blockedBy)}</section>`);
  if (c.gated) {
    const items = [...c.decisions.map((d) => ["Decision", d]), ...c.ops.map((o) => ["Ops", o])];
    parts.push(`<section class="ps"><h5>${icon("HourglassMedium")}Waiting on you</h5><ul class="gate">${items.slice(0, 12).map(([k, t]) => `<li><span class="chip2">${k}</span><span>${esc(t)}</span></li>`).join("")}</ul>${items.length > 12 ? `<div class="more">${items.length - 12} more</div>` : ""}</section>`);
  }
  const unblocks = c.dependents.filter((id) => !isDone(byId.get(id)));
  if (unblocks.length) parts.push(`<section class="ps"><h5>${icon("ArrowRight")}Unblocks</h5>${featureRows(unblocks)}</section>`);
  const linked = c.linkIds.filter((id) => !c.blockedBy.includes(id) && !unblocks.includes(id));
  if (linked.length) parts.push(`<section class="ps"><h5>${icon("Link")}Linked</h5>${featureRows(linked)}</section>`);
  return parts.join("");
}
function openDetails(c) {
  const dlg = document.getElementById("details");
  const pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
  const shown = c.open.slice(0, 12);
  const more = c.total - c.done - shown.length;
  dlg.innerHTML = `<div class="dlg">
    <button type="button" class="x" aria-label="Close">${icon("X")}</button>
    <h2 id="d-title">${esc(c.title)}</h2>
    <div class="sub">${esc(stageName(c.stage))} · ${esc(c.group)}</div>
    ${c.total ? `<div class="figure-row"><span class="figure">${c.done}/${c.total}</span><span class="meter"><i style="width:${pct}%"></i></span></div>` : ""}
    ${relationsHtml(c)}
    ${gitHtml(c)}
    ${c.phaseList.length
      ? `<ul class="phase-list">${c.phaseList.map((p, i) => `<li><button type="button" class="phase" data-phase="${i}"><span class="num">${esc(p.num)}</span><span class="pt">${esc(p.title)}</span>${p.total ? `<span class="pf">${p.done}/${p.total}</span>` : ""}${p.total && p.done === p.total ? icon("CheckCircle") : ""}</button></li>`).join("")}</ul>`
      : `${shown.length ? `<ul class="open">${shown.map((t) => `<li>${icon("Circle")}<span>${esc(t)}</span></li>`).join("")}</ul>` : ""}
    ${more > 0 ? `<div class="more">${more} more open</div>` : ""}`}
  </div>`;
  dlg.classList.remove("doc-mode");
  dlg.querySelectorAll("[data-phase]").forEach((b) =>
    b.addEventListener("click", () => {
      const p = c.phaseList[Number(b.dataset.phase)];
      openDoc(c, p.path, `${p.num} ${p.title}`, Number(b.dataset.phase));
    }),
  );
  dlg.querySelectorAll("[data-goto]").forEach((b) => b.addEventListener("click", () => { const n = byId.get(b.dataset.goto); if (n) openDetails(n); }));
  dlg.querySelector(".x").onclick = () => dlg.close();
  dlg.onclick = (e) => { if (e.target === dlg) dlg.close(); };
  dlg.onclose = () => { state.focusId = c.id; quietFocus(board.querySelector(`[data-card="${CSS.escape(c.id)}"]`)); };
  if (!dlg.open) dlg.showModal();
}

/* ---- phase preview: the phase file rendered, roadmap links open in place, Back returns ---- */
function resolveRel(fromFile, href) {
  const parts = fromFile.split("/");
  parts.pop();
  for (const seg of href.split("/")) {
    if (seg === "." || seg === "") continue;
    if (seg === "..") parts.pop();
    else parts.push(seg);
  }
  return parts.join("/");
}
async function openDoc(c, docPath, label, phaseIndex, trail = []) {
  const dlg = document.getElementById("details");
  if (!dlg.open) openDetails(c);
  let doc;
  try {
    doc = await api(`/api/doc?path=${encodeURIComponent(docPath)}`);
  } catch (error) {
    toast(firstLine(error.message), { err: true });
    return;
  }
  const back = trail.length ? trail[trail.length - 1] : null;
  dlg.classList.add("doc-mode");
  dlg.innerHTML = `<div class="dlg">
    <button type="button" class="x" aria-label="Close">${icon("X")}</button>
    <div class="doc-head"><button type="button" class="icon-btn" data-back aria-label="Back">${icon("CaretLeft")}</button><span class="crumb">${esc(c.title)} · ${esc(label)}</span></div>
    <article class="md" tabindex="0">${doc.html}</article>
  </div>`;
  // Task boxes as Phosphor glyphs, not the browser's checkbox.
  dlg.querySelectorAll('.md input[type="checkbox"]').forEach((box) => {
    const mark = document.createElement("span");
    mark.className = `tick${box.checked ? " on" : ""}`;
    mark.setAttribute("role", "img");
    mark.setAttribute("aria-label", box.checked ? "Done" : "Not done");
    mark.innerHTML = icon(box.checked ? "CheckSquare" : "Square");
    box.replaceWith(mark);
  });
  dlg.querySelector(".x").onclick = () => dlg.close();
  dlg.querySelector("[data-back]").onclick = () => {
    if (back) openDoc(c, back.path, back.label, back.phaseIndex, trail.slice(0, -1));
    else openDetails(c);
  };
  dlg.querySelector("[data-back]").focus();
  dlg.querySelectorAll(".md a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (/^https?:/i.test(href)) { a.target = "_blank"; a.rel = "noopener noreferrer"; return; }
    a.addEventListener("click", (e) => {
      e.preventDefault();
      if (href.startsWith("#")) { dlg.querySelector(`[id="${CSS.escape(href.slice(1))}"]`)?.scrollIntoView(); return; }
      let target = decodeURI(href.split("#")[0]);
      if (target.endsWith("/")) target += "README.md";
      const next = resolveRel(docPath, target);
      if (!next.startsWith(`${ROADMAP_DIR}/`) || !next.endsWith(".md")) return;
      openDoc(c, next, next.split("/").slice(-2).join("/"), null, [...trail, { path: docPath, label, phaseIndex }]);
    });
  });
}

/* ---- header ---- */
document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); state.focusId = null; render({ flip: false }); });
collapseBtn.addEventListener("click", () => {
  const keys = groupKeys();
  const allClosed = keys.length && keys.every((k) => state.collapsed.has(k));
  state.collapsed = allClosed ? new Set() : new Set(keys);
  saveView();
  render({ flip: false });
});
board.addEventListener("click", (e) => {
  const b = e.target.closest("[data-group]");
  if (!b) return;
  const key = b.dataset.group;
  state.collapsed.has(key) ? state.collapsed.delete(key) : state.collapsed.add(key);
  b.closest(".grp").toggleAttribute("data-collapsed", state.collapsed.has(key));
  b.setAttribute("aria-expanded", String(!state.collapsed.has(key)));
  saveView();
  const keys = groupKeys();
  collapseBtn.textContent = keys.length && keys.every((k) => state.collapsed.has(k)) ? "Expand all" : "Collapse all";
});
/* ---- filter panel and order ---- */
function renderFilterPanel() {
  const base = cards.filter(searchHit);
  filterPanel.innerHTML = `${FILTER_GROUPS.map((g) => `<div class="fg"><div class="fgh">${GROUP_NAME[g]}${g === "git" && state.github === false ? `<span class="miss">PR: Missing GitHub</span>` : ""}</div><div class="fopts">${FILTER_OPTIONS[g].map(([v, label, ic, test]) => `<button type="button" class="opt" data-g="${g}" data-v="${esc(v)}" aria-pressed="${state.filters[g].has(v)}">${ic ? icon(ic) : ""}<span>${esc(label)}</span><b>${base.filter(test).length}</b></button>`).join("")}</div></div>`).join("")}
    <div class="pf"><span>${plural(cards.filter(visible).length, "feature")} shown</span><button type="button" class="btn" data-clear ${activeFilters() ? "" : "disabled"}>Clear</button></div>`;
}
const filterBtn = document.getElementById("filterBtn");
const filterPanel = document.getElementById("filterPanel");
const orderSel = document.getElementById("order");
function setPanel(open) {
  filterPanel.hidden = !open;
  filterBtn.setAttribute("aria-expanded", String(open));
  if (open) renderFilterPanel();
}
filterBtn.addEventListener("click", () => setPanel(filterPanel.hidden));
filterPanel.addEventListener("click", (e) => {
  const o = e.target.closest("[data-g]");
  if (o) {
    const set = state.filters[o.dataset.g];
    set.has(o.dataset.v) ? set.delete(o.dataset.v) : set.add(o.dataset.v);
  } else if (e.target.closest("[data-clear]")) {
    state.filters = emptyFilters();
  } else return;
  saveView();
  render({ flip: false });
  renderFilterPanel();
});
document.addEventListener("pointerdown", (e) => { if (!filterPanel.hidden && !e.target.closest(".pop-wrap")) setPanel(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !filterPanel.hidden) { setPanel(false); filterBtn.focus(); } });
orderSel.addEventListener("change", () => { state.order = orderSel.value; saveView(); render(); });

/* ---- theme ---- */
const themeBtn = document.getElementById("theme");
const setTheme = (dark) => {
  document.documentElement.classList.toggle("dark", dark);
  themeBtn.innerHTML = icon(dark ? "Sun" : "Moon");
  try { localStorage.setItem("gitboard-theme", dark ? "dark" : "light"); } catch {}
};
let saved = null;
try { saved = localStorage.getItem("gitboard-theme"); } catch {}
setTheme(saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
themeBtn.onclick = () => setTheme(!document.documentElement.classList.contains("dark"));

render();
refresh()
  .catch((error) => { state.loading = false; render(); toast(`Could not read the roadmap. ${firstLine(error.message)}`, { err: true }); })
  .finally(() => setTimeout(poll, POLL_MS));
</script>
